name: cpp_nuget_pack
description: "Windows Flutter 桌面应用，用于将 C/C++ 头文件、源码和库打包为 NuGet 包。"
publish_to: "none"
version: 26.3.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.0
  flutter_svg: ^2.0.0
  fluent_ui: ^4.15.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  archive: ^4.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/catppuccin/latte/
    - assets/icons/catppuccin/mocha/
  fonts:
    - family: HarmonyOS_Sans_SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
