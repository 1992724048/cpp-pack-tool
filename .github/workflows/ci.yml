name: CI/CD

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build-and-release:
    name: Build, Test and Release (on push to master)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get version from pubspec.yaml
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Select-String -Pattern '^\s*version\s*:' | Select-Object -First 1
          if ($line) {
            $ver = ($line.ToString() -replace '^\s*version\s*:\s*','').Trim()
            $ver = $ver.Split('+')[0]
            if ($ver -match '^[\x22\x27](.*)[\x22\x27]$') { $ver = $matches[1] }
          } else { $ver = (Get-Date -Format 'yyyyMMddHHmmss') }
          ('VERSION=' + $ver) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip x86_64 build artifacts and set env
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $out_x64 = "dist/cpp_nuget_pack-${{ env.VERSION }}-win-x86_64.zip"
          if (Test-Path $out_x64) { Remove-Item $out_x64 -Force }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $out_x64 -CompressionLevel Optimal
          ('ASSET_PATH_X64=' + $out_x64) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8


      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            ## cpp_nuget_pack v${{ env.VERSION }}

            自动在 master 分支推送触发的 Release，版本来自 pubspec.yaml。

            - Windows x86_64 Release 构建
            - 包含运行产物，解压后即可运行
          draft: false
          prerelease: false
          files: |
            ${{ env.ASSET_PATH_X64 }}
